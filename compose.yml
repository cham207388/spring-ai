services:
  pg-db:
    image: 'postgres:18-alpine'
    environment:
      POSTGRES_DB: learning
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '1200:5432'
    volumes:
      - learn-ai:/var/lib/postgresql

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - '6333:6333'
      - '6334:6334'

#  redis:
#    image: redis:latest
#    ports:
#      - "6379:6379"

volumes:
  learn-ai: