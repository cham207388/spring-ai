spring:
  application:
    name: spring-ai
  ai:
    model:
      chat: openai
    openai:
      api-key: dummy
      base-url: http://localhost:12434/engines/v1
      chat:
        model: ai/gemma3

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
