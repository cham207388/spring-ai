spring:
  application:
    name: spring-ai
  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY}
      chat:
        model: gpt-4o-mini

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
  structured:
    format:
      console: ecs
      file: ecs