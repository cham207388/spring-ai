spring:
  application:
    name: spring-ai
  ai:
    bedrock:
      aws:
        region: us-east-1
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      converse:
        chat:
          model: arn:aws:bedrock:us-east-1:939813658752:inference-profile/us.anthropic.claude-sonnet-4-6
          temperature: 0.7
    openai:
      api-key: ${OPEN_AI_API_KEY}
      chat:
        model: gpt-4o-mini
    chat:
      client:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
  structured:
    format:
      console: ecs
      file: ecs