spring:
  application:
    name: spring-ai
  ai:
#    openai:
#      api-key: ${OPEN_AI_API_KEY}
    model:
      chat: ollama
    ollama:
      chat:
        model: llama3.2:1b

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
  structured:
    format:
      console: ecs
      file: ecs