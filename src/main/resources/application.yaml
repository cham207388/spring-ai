spring:
  application:
    name: spring-ai
  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY}
      chat: # this object can be configured using ChatOptions
        model: gpt-4o-mini
        #        max-completion-tokens: 100
        temperature: 0.7
    #      embedding:
    #        model: text-embedding-3-small
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        initialize-schema: true
        collection-name: vendra
        use-tls: false

  datasource:
    url: jdbc:postgresql://localhost:1200/learning
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

#  data:
#    redis:
#      host: localhost
#      port: 6379



management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
  #  structured:
  #    format:
  #      console: ecs
  #      file: ecs
  level:
    org.springframework.ai.chat.client.advisor: DEBUG